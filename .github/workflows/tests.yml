name: Protocol checks
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-core.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests
      - run: python scripts/benchmarks/generate_smoke_benchmark.py
      - run: python scripts/benchmarks/run_paper_campaign.py --observation-dir outputs/smoke/data/observations --evaluation-dir outputs/smoke/data/evaluation_only --output-dir outputs/smoke/run --spec configs/smoke.json --seeds 0 --device cpu
      - name: Install full paper environment
        run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Check simulator and legacy learner imports
        run: python -c "import wntr, opendssdirect, pandapower, simbench, torch_geometric; print('Paper environment imports OK')"
